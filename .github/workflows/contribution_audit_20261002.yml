    steps:
      - name: Checkout validation runner
        uses: actions/checkout@v4
        with:
          path: audit
          persist-credentials: false
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - name: Checkout native PyTorch3D transforms
        if: matrix.vendor
        uses: actions/checkout@v4
        with:
          repository: facebookresearch/pytorch3d
          ref: 88e182f989c80836f4bd744e0d9cb1852762ce01
          path: candidate/vendor/pytorch3d
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU tensor runtime
        run: python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install native import dependencies
        run: >-
          python -m pip install numpy==1.26.4 scipy==1.15.3
          einops==0.8.1 diffusers==0.35.1 transformers==4.57.1
          accelerate==1.10.1 omegaconf==2.3.0 iopath==0.1.10
          opencv-python-headless==4.11.0.86 easydict==1.13 ftfy==6.3.1
          zarr==2.18.7 numcodecs==0.15.1 dill==0.4.0 pandas==2.2.3
          scikit-learn==1.6.1 h5py==3.14.0 imageio==2.37.0 imageio-ffmpeg==0.6.0 termcolor==3.1.0 matplotlib==3.10.1 psutil==7.0.0
      - name: Install candidate-specific dependencies
        env:
          EXTRA_REQUIREMENTS: ${{ matrix.dependencies }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          requirements = json.loads(os.environ["EXTRA_REQUIREMENTS"])
          if requirements:
              subprocess.check_call([sys.executable, "-m", "pip", "install", *requirements])
          PY
      - name: Verify native candidate and original baseline
        working-directory: candidate
        env:
          PYTHONPATH: ${{ matrix.pythonpath }}
          LIDRA_SKIP_INIT: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          CANDIDATE_TEST: ${{ matrix.test }}
          CANDIDATE_BASE: ${{ matrix.base }}
          CANDIDATE_SOURCES: ${{ matrix.sources }}
          CANDIDATE_COUNT: ${{ matrix.count }}
        run: >-
          python ../audit/validation/validate_candidate.py
          --test "$CANDIDATE_TEST" --base "$CANDIDATE_BASE"
          --sources "$CANDIDATE_SOURCES" --count "$CANDIDATE_COUNT"
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ matrix.id }}
          path: candidate/*result.json
