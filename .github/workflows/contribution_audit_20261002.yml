name: Core contribution regression audit
on:
  push:
    branches: [validation/contribution-audit-20261002]
permissions:
  contents: read
jobs:
  regression:
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - {"id":"dreamer-unbounded-actions","repository":"Afloat16/dreamerv3","ref":"d3362d6c0e559ec1148c76d3dc3364ec7881bb3d","base":"e3f02248693a79dc8b0ebd62c93683888ddaccfe","test":"embodied/tests/test_normalize_action_bounds.py","sources":"[\"embodied/core/wrappers.py\"]","count":2,"dependencies":"[\"numpy==1.26.4\",\"elements==3.19.1\",\"portal==3.5.0\",\"jax[cpu]==0.4.33\",\"chex==0.1.87\",\"optax==0.2.4\",\"ninjax==3.5.1\",\"scope==0.4.4\",\"einops\",\"gym==0.26.2\"]","vendor":false,"pythonpath":".:training:qwen-vl-finetune:qwen-vl-utils/src:detr:o-voxel:vendor/pytorch3d"}
          - {"id":"dust3r-homogeneous-grid-axis","repository":"Afloat16/dust3r","ref":"085b7722fca66f67e722a05eb5487ef231f3df6d","base":"4c24a6ebf04809f2cfe59915e51779c8984aaa40","test":"tests/test_homogeneous_grid_axis.py","sources":"[\"dust3r/utils/geometry.py\"]","count":3,"dependencies":"[\"torch\",\"numpy\",\"scipy\"]","vendor":false,"pythonpath":".:training:qwen-vl-finetune:qwen-vl-utils/src:detr:o-voxel:vendor/pytorch3d"}
          - {"id":"vq-lfq-distributed-mean","repository":"Afloat16/vector-quantize-pytorch","ref":"a060d4124562f40a8e6340a780f5152e514eef6b","base":"4103bf2c7be993b6e0ac21d88684818c9880c478","test":"tests/test_lfq_distributed_mean.py","sources":"[\"vector_quantize_pytorch/lookup_free_quantization.py\"]","count":2,"dependencies":"[\"torch\",\"einops>=0.8.0\",\"einx>=0.3.0\",\"torch-einops-utils>=0.1.29\",\"loguru\",\"packaging\"]","vendor":false,"pythonpath":".:training:qwen-vl-finetune:qwen-vl-utils/src:detr:o-voxel:vendor/pytorch3d"}
          - {"id":"vq-latent-frozen-movement","repository":"Afloat16/vector-quantize-pytorch","ref":"bdc33a588d60dc0e681a76083b6aa52d0748a7e4","base":"4103bf2c7be993b6e0ac21d88684818c9880c478","test":"tests/test_latent_frozen_movement.py","sources":"[\"vector_quantize_pytorch/latent_quantization.py\"]","count":5,"dependencies":"[\"torch\",\"einops>=0.8.0\",\"einx>=0.3.0\",\"torch-einops-utils>=0.1.29\",\"loguru\",\"packaging\"]","vendor":false,"pythonpath":".:training:qwen-vl-finetune:qwen-vl-utils/src:detr:o-voxel:vendor/pytorch3d"}
          - {"id":"qwen-mathvision-safe-grading","repository":"Afloat16/Qwen3-VL","ref":"f20eecdddebb2e9ff58307d6d188ae8f75a8ce1e","base":"96588727e44c78b25ba03ea03b8e12f7e64fd0da","test":"evaluation/MathVision/tests/test_safe_grading.py","sources":"[\"evaluation/MathVision/eval_utils.py\",\"evaluation/MathVision/common_utils.py\"]","count":6,"dependencies":"[\"pandas\",\"pillow\",\"requests\",\"latex2sympy2\"]","vendor":false,"pythonpath":".:training:qwen-vl-finetune:qwen-vl-utils/src:detr:o-voxel:vendor/pytorch3d"}
          - {"id":"qwen-vision-learning-rate","repository":"Afloat16/Qwen3-VL","ref":"e4ee47e016f2437177fa1fb09b99d65e659a69d0","base":"96588727e44c78b25ba03ea03b8e12f7e64fd0da","test":"qwen-vl-finetune/tests/test_vision_learning_rate.py","sources":"[\"qwen-vl-finetune/qwenvl/train/trainer.py\"]","count":8,"dependencies":"[\"torch==2.6.0\",\"torchvision==0.21.0\",\"transformers==4.57.1\",\"accelerate\"]","vendor":false,"pythonpath":".:training:qwen-vl-finetune:qwen-vl-utils/src:detr:o-voxel:vendor/pytorch3d"}
          - {"id":"nanogpt-scaler-resume","repository":"Afloat16/nanoGPT","ref":"a871044de04b43e13701160c427824096a7c76e3","base":"3adf61e154c3fe3fca428ad6bc3818b27a3b8291","test":"tests/test_scaler_checkpoint.py","sources":"[\"train.py\"]","count":3,"dependencies":"[\"torch==2.6.0\",\"numpy\"]","vendor":false,"pythonpath":".:training:qwen-vl-finetune:qwen-vl-utils/src:detr:o-voxel:vendor/pytorch3d"}
          - {"id":"nanogpt-strided-targets","repository":"Afloat16/nanoGPT","ref":"fa6969bc10760aa4cb52df34495a674cb86b724f","base":"3adf61e154c3fe3fca428ad6bc3818b27a3b8291","test":"tests/test_strided_targets.py","sources":"[\"model.py\"]","count":3,"dependencies":"[\"torch==2.6.0\",\"numpy\"]","vendor":false,"pythonpath":".:training:qwen-vl-finetune:qwen-vl-utils/src:detr:o-voxel:vendor/pytorch3d"}
          - {"id":"wan-flow-noise","repository":"Afloat16/Wan2.2","ref":"78f1cd9b98054ecc18d07ada3133b04d12dffbdf","base":"1ea34ff48f87168174e12956e200b1d908b1c5ff","test":"tests/test_flow_noise_conversion.py","sources":"[\"wan/utils/fm_solvers.py\",\"wan/utils/fm_solvers_unipc.py\"]","count":3,"dependencies":"[\"torch==2.6.0\",\"torchvision==0.21.0\",\"diffusers==0.35.1\",\"numpy==1.26.4\",\"scipy==1.15.3\",\"requests\",\"Pillow\",\"packaging\"]","vendor":false,"pythonpath":".:training:qwen-vl-finetune:qwen-vl-utils/src:detr:o-voxel:vendor/pytorch3d"}
          - {"id":"wan-video-backend","repository":"Afloat16/Wan2.2","ref":"a6bcb5b10e7ed15ae2ff22c29dceca990740d636","base":"1ea34ff48f87168174e12956e200b1d908b1c5ff","test":"tests/test_video_reader_backend.py","sources":"[\"wan/utils/qwen_vl_utils.py\"]","count":2,"dependencies":"[\"torch==2.6.0\",\"torchvision==0.21.0\",\"diffusers==0.35.1\",\"numpy==1.26.4\",\"scipy==1.15.3\",\"requests\",\"Pillow\",\"packaging\"]","vendor":false,"pythonpath":".:training:qwen-vl-finetune:qwen-vl-utils/src:detr:o-voxel:vendor/pytorch3d"}
          - {"id":"wan-custom-sigma-list","repository":"Afloat16/Wan2.2","ref":"1bd292ad094089f7216c535a95eb02b050bd2cd4","base":"1ea34ff48f87168174e12956e200b1d908b1c5ff","test":"tests/test_custom_sigma_schedule.py","sources":"[\"wan/utils/fm_solvers.py\",\"wan/utils/fm_solvers_unipc.py\"]","count":3,"dependencies":"[\"torch==2.6.0\",\"diffusers==0.35.1\",\"numpy==1.26.4\",\"scipy==1.15.3\"]","vendor":false,"pythonpath":".:training:qwen-vl-finetune:qwen-vl-utils/src:detr:o-voxel:vendor/pytorch3d"}
    steps:
      - name: Checkout validation runner
        uses: actions/checkout@v4
        with:
          path: audit
          persist-credentials: false
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - name: Checkout native PyTorch3D transforms
        if: matrix.vendor
        uses: actions/checkout@v4
        with:
          repository: facebookresearch/pytorch3d
          ref: 88e182f989c80836f4bd744e0d9cb1852762ce01
          path: candidate/vendor/pytorch3d
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU tensor runtime
        run: python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install native import dependencies
        run: >-
          python -m pip install numpy==1.26.4 scipy==1.15.3
          einops==0.8.1 diffusers==0.35.1 transformers==4.57.1
          accelerate==1.10.1 omegaconf==2.3.0 iopath==0.1.10
          opencv-python-headless==4.11.0.86 easydict==1.13 ftfy==6.3.1
          zarr==2.18.7 numcodecs==0.15.1 dill==0.4.0 pandas==2.2.3
          scikit-learn==1.6.1 h5py==3.14.0 imageio==2.37.0 imageio-ffmpeg==0.6.0 termcolor==3.1.0 matplotlib==3.10.1 psutil==7.0.0
      - name: Install candidate-specific dependencies
        env:
          EXTRA_REQUIREMENTS: ${{ matrix.dependencies }}
        run: |
          python - <<'PY'
          import json, os, subprocess, sys
          requirements = json.loads(os.environ["EXTRA_REQUIREMENTS"])
          if requirements:
              subprocess.check_call([sys.executable, "-m", "pip", "install", *requirements])
          PY
      - name: Verify native candidate and original baseline
        working-directory: candidate
        env:
          PYTHONPATH: ${{ matrix.pythonpath }}
          LIDRA_SKIP_INIT: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          CANDIDATE_TEST: ${{ matrix.test }}
          CANDIDATE_BASE: ${{ matrix.base }}
          CANDIDATE_SOURCES: ${{ matrix.sources }}
          CANDIDATE_COUNT: ${{ matrix.count }}
        run: >-
          python ../audit/validation/validate_candidate.py
          --test "$CANDIDATE_TEST" --base "$CANDIDATE_BASE"
          --sources "$CANDIDATE_SOURCES" --count "$CANDIDATE_COUNT"
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ matrix.id }}
          path: candidate/*result.json
