name: Core contribution regression audit
on:
  push:
    branches:
      - validation/contribution-audit-20261002
permissions:
  contents: read
jobs:
  regression:
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - id: "diffusion-negative-episode-slice"
            repository: "Afloat16/diffusion_policy"
            ref: "316d6300574bbc5ec8710962c2f35666a20a15cb"
            base: "5ba07ac6661db573af695b419a7947ecb704690f"
            test: "tests/test_replay_episode_slice.py"
            sources: "[\"diffusion_policy/common/replay_buffer.py\"]"
            count: 3
            transformers: "4.57.1"
          - id: "diffusion-replay-append-validation"
            repository: "Afloat16/diffusion_policy"
            ref: "69f63bf86a095381dec85825231f174f08311b81"
            base: "5ba07ac6661db573af695b419a7947ecb704690f"
            test: "tests/test_replay_append_validation.py"
            sources: "[\"diffusion_policy/common/replay_buffer.py\"]"
            count: 4
            transformers: "4.57.1"
          - id: "robomimic-logsumexp-limits"
            repository: "Afloat16/robomimic"
            ref: "51a63bd49a2bbd0e38904a44145f621cc14e195e"
            base: "d309eaecc18acf4152a830a895a6984b8ac71b05"
            test: "tests/test_log_sum_exp_boundaries.py"
            sources: "[\"robomimic/utils/loss_utils.py\"]"
            count: 4
            transformers: "4.57.1"
          - id: "robomimic-terminal-returns"
            repository: "Afloat16/robomimic"
            ref: "aa57446e7f21150852e43dc5f6d25546b3de48c6"
            base: "d309eaecc18acf4152a830a895a6984b8ac71b05"
            test: "tests/test_n_step_terminal_returns.py"
            sources: "[\"robomimic/utils/loss_utils.py\",\"robomimic/algo/cql.py\",\"robomimic/algo/bcq.py\",\"robomimic/algo/td3_bc.py\"]"
            count: 4
            transformers: "4.57.1"
          - id: "robomimic-weighted-generator"
            repository: "Afloat16/robomimic"
            ref: "70a7a6352e2628f2c441a16810a4b0c3b6cf143e"
            base: "d309eaecc18acf4152a830a895a6984b8ac71b05"
            test: "tests/test_weighted_sampler_generator.py"
            sources: "[\"robomimic/utils/dataset.py\"]"
            count: 4
            transformers: "4.57.1"
    steps:
      - name: Checkout validation runner
        uses: actions/checkout@v4
        with:
          path: audit
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU tensor runtime
        run: python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install native import dependencies
        run: >-
          python -m pip install numpy==1.26.4 scipy==1.15.3
          einops==0.8.1 diffusers==0.35.1 transformers==${{ matrix.transformers }}
          accelerate==1.10.1 omegaconf==2.3.0 iopath==0.1.10
          opencv-python-headless==4.11.0.86 easydict==1.13 ftfy==6.3.1
          zarr==2.18.7 numcodecs==0.15.1 dill==0.4.0 pandas==2.2.3
          scikit-learn==1.6.1 h5py==3.14.0 imageio==2.37.0 imageio-ffmpeg==0.6.0 termcolor==3.1.0 matplotlib==3.10.1 psutil==7.0.0 pycocotools==2.0.10 numba==0.61.2 IPython==8.37.0 packaging==25.0
      - name: Verify native candidate and original baseline
        working-directory: candidate
        env:
          PYTHONPATH: .:training:qwen-vl-finetune
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          CANDIDATE_TEST: ${{ matrix.test }}
          CANDIDATE_BASE: ${{ matrix.base }}
          CANDIDATE_SOURCES: ${{ matrix.sources }}
          CANDIDATE_COUNT: ${{ matrix.count }}
        run: >-
          python ../audit/validation/validate_candidate.py
          --test "$CANDIDATE_TEST" --base "$CANDIDATE_BASE"
          --sources "$CANDIDATE_SOURCES" --count "$CANDIDATE_COUNT"
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ matrix.id }}
          path: candidate/*result.json
