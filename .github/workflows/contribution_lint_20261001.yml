name: DINOv3 contribution lint delta
on:
  push:
    branches:
      - validation/contribution-lint-20261001
permissions:
  contents: read
jobs:
  lint:
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: "dinov3-sigloss"
            ref: "3206b0dec3828d2ebad68b7262ccbeb087921281"
            test: "dinov3/tests/test_depth_sigloss.py"
            source: "dinov3/eval/depth/loss.py"
            base: "6876159a11b4df116f30f667f8c9888617df0751"
          - id: "dinov3-masked-gradients"
            ref: "ae330aa2cf3a7ae3f1342307b8fd4ba34a29c527"
            test: "dinov3/tests/test_depth_gradient_loss.py"
            source: "dinov3/eval/depth/loss.py"
            base: "6876159a11b4df116f30f667f8c9888617df0751"
          - id: "dinov3-sampler-resume"
            ref: "304b31fceeb48ed25ca1027955fc1b1ad2a170a6"
            test: "dinov3/tests/test_sharded_sampler_resume.py"
            source: "dinov3/data/samplers.py"
            base: "6876159a11b4df116f30f667f8c9888617df0751"
    steps:
      - name: Checkout validation runner
        uses: actions/checkout@v4
        with:
          path: audit
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
        with:
          repository: Afloat16/dinov3
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install exact upstream development dependencies
        run: pip install -r candidate/requirements-dev.txt
      - name: Verify changed-file Ruff checks and compare full-tree diagnostics
        working-directory: candidate
        run: >-
          python ../audit/validation/check_lint_delta.py
          --base "${{ matrix.base }}"
          --source "${{ matrix.source }}"
          --test "${{ matrix.test }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-delta-${{ matrix.id }}
          path: candidate/lint-delta.json
