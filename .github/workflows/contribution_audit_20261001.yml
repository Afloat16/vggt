name: Core contribution regression audit
on:
  push:
    branches:
      - validation/contribution-audit-20261001
permissions:
  contents: read
jobs:
  regression:
    name: ${{ matrix.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include:
          - id: "robomimic-discrete-samples"
            repository: "Afloat16/robomimic"
            ref: "c63a5864c66a2b81f6649c1ecf9aa6f3efc78dd2"
            base: "d309eaecc18acf4152a830a895a6984b8ac71b05"
            test: "tests/test_discrete_value_distribution.py"
            sources: "[\"robomimic/models/distributions.py\"]"
            count: 4
            transformers: "4.57.1"
          - id: "robomimic-tanh-jacobian"
            repository: "Afloat16/robomimic"
            ref: "740dbced4495352b958d50ca64644edfcf654840"
            base: "d309eaecc18acf4152a830a895a6984b8ac71b05"
            test: "tests/test_tanh_wrapped_distribution.py"
            sources: "[\"robomimic/models/distributions.py\"]"
            count: 4
            transformers: "4.57.1"
          - id: "lingbot-flow-noise"
            repository: "Afloat16/lingbot-world-v2"
            ref: "d30a4f213883b713089e922a1df7a43702ee6706"
            base: "1895d300d8ac936401689b26389f51cbd36530eb"
            test: "tests/test_flow_noise_conversion.py"
            sources: "[\"wan/utils/fm_solvers.py\",\"wan/utils/fm_solvers_unipc.py\"]"
            count: 3
            transformers: "4.51.3"
          - id: "lingbot-long-rope"
            repository: "Afloat16/lingbot-world-v2"
            ref: "e308154d6f2e089653997fd278a8b339913fd22c"
            base: "1895d300d8ac936401689b26389f51cbd36530eb"
            test: "tests/test_long_causal_rope.py"
            sources: "[\"wan/modules/model.py\",\"wan/modules/model_causal.py\",\"wan/modules/model_fast.py\"]"
            count: 3
            transformers: "4.51.3"
          - id: "qwen-packed-attention"
            repository: "Afloat16/Qwen3-VL"
            ref: "3b56a4cfa273ef3d6c295300e45f6b4c8ba0b348"
            base: "96588727e44c78b25ba03ea03b8e12f7e64fd0da"
            test: "qwen-vl-finetune/tests/test_packed_attention.py"
            sources: "[\"qwen-vl-finetune/qwenvl/train/trainer.py\"]"
            count: 5
            transformers: "4.57.1"
    steps:
      - name: Checkout validation runner
        uses: actions/checkout@v4
        with:
          path: audit
      - name: Checkout exact candidate commit
        uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          fetch-depth: 0
          path: candidate
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CPU tensor runtime
        run: python -m pip install torch==2.6.0 torchvision==0.21.0 --index-url https://download.pytorch.org/whl/cpu
      - name: Install native import dependencies
        run: >-
          python -m pip install numpy==1.26.4 scipy==1.15.3
          einops==0.8.1 diffusers==0.35.1 transformers==${{ matrix.transformers }}
          accelerate==1.10.1 omegaconf==2.3.0 iopath==0.1.10
          opencv-python-headless==4.11.0.86 easydict==1.13 ftfy==6.3.1
          zarr==2.18.7 numcodecs==0.15.1 dill==0.4.0 pandas==2.2.3
          scikit-learn==1.6.1 h5py==3.14.0 imageio==2.37.0 imageio-ffmpeg==0.6.0 termcolor==3.1.0
      - name: Verify native candidate and original baseline
        working-directory: candidate
        env:
          PYTHONPATH: .:training:qwen-vl-finetune
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          CANDIDATE_TEST: ${{ matrix.test }}
          CANDIDATE_BASE: ${{ matrix.base }}
          CANDIDATE_SOURCES: ${{ matrix.sources }}
          CANDIDATE_COUNT: ${{ matrix.count }}
        run: >-
          python ../audit/validation/validate_candidate.py
          --test "$CANDIDATE_TEST" --base "$CANDIDATE_BASE"
          --sources "$CANDIDATE_SOURCES" --count "$CANDIDATE_COUNT"
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-${{ matrix.id }}
          path: candidate/*result.json
